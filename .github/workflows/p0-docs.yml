name: P0 documentation

on:
  pull_request:
  push:
    branches:
      - 'codex/**'

permissions:
  contents: read

jobs:
  p0-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check publication and document structure
        run: python3 scripts/check_p0.py
      - name: Check adversarial publication fixtures
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
